name: Weekly pick'em agent

on:
  schedule:
    - cron: "17 13 * * 2"   # Tuesdays ~8-9am ET: score last week's picks
    - cron: "17 14 * * 3"   # Wednesdays ~9-10am ET: make and email this week's picks
  workflow_dispatch:         # adds a "Run workflow" button for manual runs
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [picks, score]
        default: picks

permissions:
  contents: write            # lets the run save picks and results back to the repo

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install add-ons
        run: pip install -r requirements.txt

      - name: Choose task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TASK=${{ inputs.task }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "17 13 * * 2" ]; then
            echo "TASK=score" >> "$GITHUB_ENV"
          else
            echo "TASK=picks" >> "$GITHUB_ENV"
          fi

      - name: Run the agent
        run: python main.py "$TASK"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Save picks and results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add picks_week*.json results.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Automated ${TASK} run"
          git push
